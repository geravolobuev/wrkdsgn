name: Scrape Telegram Jobs

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Telethon session
        run: |
          if [ -n "${{ secrets.TELETHON_SESSION_B64 }}" ]; then
            echo "${{ secrets.TELETHON_SESSION_B64 }}" | base64 -d > telegram_session.session
          fi

      - name: Run scraper
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          SOURCE_CHANNEL: ${{ secrets.SOURCE_CHANNEL }}
          SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELETHON_SESSION_NAME: telegram_session
          FETCH_LIMIT: 30
          ENABLE_AI_ENRICHMENT: ${{ secrets.ENABLE_AI_ENRICHMENT }}
          OLLAMA_ENABLED: ${{ secrets.OLLAMA_ENABLED }}
          OLLAMA_API_URL: ${{ secrets.OLLAMA_API_URL }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          ENRICHMENT_VERSION: ${{ secrets.ENRICHMENT_VERSION }}
        run: python src/main.py
